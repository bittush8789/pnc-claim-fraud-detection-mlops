apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pnc-claim-fraud-ops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bittush8789/pnc-claim-fraud-detection-mlops.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: pc-claims
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
